name: GUI and metadata tests
on:
  push:
    branches: [master, gui-integration]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest
      - name: Test
        env:
          APPDATA: ${{ runner.temp }}/qobuz-test-config
          HOME: ${{ runner.temp }}/qobuz-test-config
        run: python -m pytest tests -q
